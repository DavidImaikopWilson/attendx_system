<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <defs>
    <style>
      .label { font-size:11px; fill:#7a93b8 }
      .title { font-size:13px; fill:#e2e8f0; font-weight:600 }
      .small { font-size:10px; fill:#7a93b8 }
      .code  { font-size:10px; fill:#f59e0b }
      .green { font-size:10px; fill:#22d3a0 }
      .box   { rx:8; stroke-width:1.5 }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5070"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3a0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#0c1424"/>

  <!-- Grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#243757" stroke-width="0.4"/>
  </pattern>
  <rect width="900" height="620" fill="url(#grid)" opacity="0.4"/>

  <!-- ═══════ TITLE ═══════ -->
  <text x="450" y="38" text-anchor="middle" font-family="DM Serif Display, serif" font-size="22" fill="#f59e0b">AttendX — System Architecture</text>
  <text x="450" y="56" text-anchor="middle" class="label">Location-Based Attendance System · v1.0</text>

  <!-- ═══════ CLIENT LAYER ═══════ -->
  <rect x="30" y="76" width="840" height="150" fill="#131f35" class="box" stroke="#243757" rx="8"/>
  <text x="50" y="100" class="label" font-size="9" letter-spacing="2">CLIENT LAYER — BROWSER</text>

  <!-- Login page -->
  <rect x="55" y="108" width="160" height="100" fill="#1c2e4a" class="box" stroke="#3a5070" rx="6"/>
  <text x="135" y="130" text-anchor="middle" class="title" font-size="12">login.html</text>
  <text x="135" y="150" text-anchor="middle" class="code">POST /api/auth/login</text>
  <text x="135" y="166" text-anchor="middle" class="small">bcrypt auth</text>
  <text x="135" y="182" text-anchor="middle" class="small">session cookie</text>

  <!-- Student Dashboard -->
  <rect x="250" y="108" width="190" height="100" fill="#1c2e4a" class="box" stroke="#3a5070" rx="6"/>
  <text x="345" y="130" text-anchor="middle" class="title" font-size="12">student_dashboard.html</text>
  <text x="345" y="150" text-anchor="middle" class="code">GET /api/student/courses</text>
  <text x="345" y="166" text-anchor="middle" class="code">POST /api/student/attend</text>
  <text x="345" y="182" text-anchor="middle" class="green">navigator.geolocation ↗</text>

  <!-- Lecturer Dashboard -->
  <rect x="465" y="108" width="200" height="100" fill="#1c2e4a" class="box" stroke="#3a5070" rx="6"/>
  <text x="565" y="130" text-anchor="middle" class="title" font-size="12">lecturer_dashboard.html</text>
  <text x="565" y="150" text-anchor="middle" class="code">GET /api/lecturer/courses</text>
  <text x="565" y="166" text-anchor="middle" class="code">POST /api/session/start</text>
  <text x="565" y="182" text-anchor="middle" class="code">GET  /api/session/{id}</text>

  <!-- GPS Chip -->
  <rect x="695" y="108" width="155" height="100" fill="#0c1424" class="box" stroke="#22d3a0" rx="6"/>
  <text x="772" y="130" text-anchor="middle" class="green" font-size="11" font-weight="600">GPS / Geolocation</text>
  <text x="772" y="150" text-anchor="middle" class="small">getCurrentPosition()</text>
  <text x="772" y="167" text-anchor="middle" class="small">High accuracy mode</text>
  <text x="772" y="184" text-anchor="middle" class="small">Accuracy ≤ 30m check</text>

  <!-- Arrow: GPS → Student -->
  <line x1="695" y1="158" x2="440" y2="158" stroke="#22d3a0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="568" y="153" text-anchor="middle" class="green" font-size="9">lat, lng, accuracy</text>

  <!-- ═══════ FLASK LAYER ═══════ -->
  <rect x="30" y="248" width="840" height="200" fill="#131f35" class="box" stroke="#243757" rx="8"/>
  <text x="50" y="272" class="label" font-size="9" letter-spacing="2">FLASK APPLICATION — app.py</text>

  <!-- Vertical arrow: Browser → Flask -->
  <line x1="450" y1="226" x2="450" y2="248" stroke="#3a5070" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="240" class="small" font-size="9">HTTP / JSON</text>

  <!-- Auth Module -->
  <rect x="55" y="280" width="160" height="148" fill="#1c2e4a" class="box" stroke="#3a5070" rx="6"/>
  <text x="135" y="302" text-anchor="middle" class="title" font-size="11">Auth Layer</text>
  <line x1="65" y1="308" x2="205" y2="308" stroke="#243757" stroke-width="1"/>
  <text x="135" y="326" text-anchor="middle" class="small">bcrypt.checkpw()</text>
  <text x="135" y="342" text-anchor="middle" class="small">Flask session cookie</text>
  <text x="135" y="358" text-anchor="middle" class="small">Role-based decorator</text>
  <text x="135" y="374" text-anchor="middle" class="small">@login_required(role=)</text>
  <text x="135" y="390" text-anchor="middle" class="small">401 / 403 guards</text>
  <text x="135" y="410" text-anchor="middle" class="small">CSRF via Flask secret</text>

  <!-- Validation Pipeline -->
  <rect x="245" y="280" width="270" height="148" fill="#1c2e4a" class="box" stroke="#f59e0b" rx="6"/>
  <text x="380" y="302" text-anchor="middle" class="title" font-size="11" fill="#f59e0b">Attendance Validator</text>
  <line x1="255" y1="308" x2="505" y2="308" stroke="#243757" stroke-width="1"/>
  <text x="280" y="326" class="small">① Session exists &amp; ACTIVE?</text>
  <text x="280" y="342" class="small">② current_time ≤ end_time?</text>
  <text x="280" y="358" class="small">③ Student enrolled?</text>
  <text x="280" y="374" class="small">④ Already submitted?  → 409</text>
  <text x="280" y="390" class="small">⑤ GPS accuracy ≤ 30m?</text>
  <text x="280" y="406" class="small">⑥ Haversine ≤ 50m?</text>
  <text x="380" y="422" text-anchor="middle" class="green" font-size="10">✓ All pass → PRESENT record</text>

  <!-- Geofence Module -->
  <rect x="545" y="280" width="195" height="148" fill="#1c2e4a" class="box" stroke="#22d3a0" rx="6"/>
  <text x="642" y="302" text-anchor="middle" class="title" font-size="11" fill="#22d3a0">Haversine Geofence</text>
  <line x1="555" y1="308" x2="730" y2="308" stroke="#243757" stroke-width="1"/>
  <text x="642" y="328" text-anchor="middle" class="small">Earth radius R = 6,371 km</text>
  <text x="642" y="346" text-anchor="middle" class="small">Δφ = lat2 − lat1</text>
  <text x="642" y="362" text-anchor="middle" class="small">Δλ = lng2 − lng1</text>
  <text x="642" y="378" text-anchor="middle" class="small">a = sin²(Δφ/2) + ...</text>
  <text x="642" y="394" text-anchor="middle" class="small">d = 2R·atan2(√a,√1-a)</text>
  <text x="642" y="416" text-anchor="middle" class="green" font-size="10">Radius fixed: 50 metres</text>

  <!-- Session Timer box -->
  <rect x="760" y="280" width="95" height="148" fill="#0c1424" class="box" stroke="#3a5070" rx="6"/>
  <text x="807" y="302" text-anchor="middle" class="title" font-size="10">Auto-close</text>
  <line x1="768" y1="308" x2="847" y2="308" stroke="#243757" stroke-width="1"/>
  <text x="807" y="326" text-anchor="middle" class="small" font-size="9">end_time =</text>
  <text x="807" y="340" text-anchor="middle" class="small" font-size="9">now + dur</text>
  <text x="807" y="360" text-anchor="middle" class="small" font-size="9">Lazy close</text>
  <text x="807" y="376" text-anchor="middle" class="small" font-size="9">on request</text>
  <text x="807" y="396" text-anchor="middle" class="code" font-size="9">5–60 min</text>

  <!-- ═══════ DATABASE LAYER ═══════ -->
  <rect x="30" y="470" width="840" height="130" fill="#131f35" class="box" stroke="#243757" rx="8"/>
  <text x="50" y="494" class="label" font-size="9" letter-spacing="2">DATABASE — PostgreSQL / MySQL / SQLite</text>

  <!-- Arrow: Flask → DB -->
  <line x1="450" y1="448" x2="450" y2="470" stroke="#3a5070" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="462" class="small" font-size="9">SQLAlchemy ORM</text>

  <!-- Tables -->
  <rect x="55" y="503" width="100" height="78" fill="#1c2e4a" class="box" stroke="#3a5070" rx="4"/>
  <text x="105" y="522" text-anchor="middle" class="title" font-size="10">users</text>
  <text x="105" y="538" text-anchor="middle" class="small" font-size="9">id, name, email</text>
  <text x="105" y="552" text-anchor="middle" class="small" font-size="9">password_hash</text>
  <text x="105" y="566" text-anchor="middle" class="small" font-size="9">role (student|lect)</text>

  <rect x="185" y="503" width="120" height="78" fill="#1c2e4a" class="box" stroke="#3a5070" rx="4"/>
  <text x="245" y="522" text-anchor="middle" class="title" font-size="10">courses</text>
  <text x="245" y="538" text-anchor="middle" class="small" font-size="9">id, course_code</text>
  <text x="245" y="552" text-anchor="middle" class="small" font-size="9">lecturer_id (FK)</text>
  <text x="245" y="566" text-anchor="middle" class="small" font-size="9">location_lat/lng</text>

  <rect x="335" y="503" width="115" height="78" fill="#1c2e4a" class="box" stroke="#3a5070" rx="4"/>
  <text x="392" y="522" text-anchor="middle" class="title" font-size="10">enrollments</text>
  <text x="392" y="538" text-anchor="middle" class="small" font-size="9">student_id (FK)</text>
  <text x="392" y="552" text-anchor="middle" class="small" font-size="9">course_id (FK)</text>
  <text x="392" y="566" text-anchor="middle" class="small" font-size="9">UNIQUE constraint</text>

  <rect x="480" y="503" width="155" height="78" fill="#1c2e4a" class="box" stroke="#f59e0b" rx="4"/>
  <text x="557" y="522" text-anchor="middle" class="title" font-size="10" fill="#f59e0b">attendance_sessions</text>
  <text x="557" y="538" text-anchor="middle" class="small" font-size="9">course_id (FK)</text>
  <text x="557" y="552" text-anchor="middle" class="small" font-size="9">start_time, end_time</text>
  <text x="557" y="566" text-anchor="middle" class="small" font-size="9">status ACTIVE|CLOSED</text>

  <rect x="665" y="503" width="175" height="78" fill="#1c2e4a" class="box" stroke="#22d3a0" rx="4"/>
  <text x="752" y="522" text-anchor="middle" class="title" font-size="10" fill="#22d3a0">attendance_records</text>
  <text x="752" y="538" text-anchor="middle" class="small" font-size="9">session_id, student_id (FK)</text>
  <text x="752" y="552" text-anchor="middle" class="small" font-size="9">lat, lng, accuracy, dist_m</text>
  <text x="752" y="566" text-anchor="middle" class="small" font-size="9">status PRESENT</text>

  <!-- DB relationship lines -->
  <line x1="155" y1="542" x2="185" y2="542" stroke="#3a5070" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="305" y1="542" x2="335" y2="542" stroke="#3a5070" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="450" y1="542" x2="480" y2="542" stroke="#3a5070" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="635" y1="542" x2="665" y2="542" stroke="#22d3a0" stroke-width="1" stroke-dasharray="4,2"/>
</svg>
