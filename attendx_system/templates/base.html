<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AttendX{% endblock %} — University Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── DESIGN TOKENS ─── */
    :root {
      --navy:       #0c1424;
      --navy-mid:   #131f35;
      --navy-light: #1c2e4a;
      --border:     #243757;
      --text:       #e2e8f0;
      --muted:      #7a93b8;
      --amber:      #f59e0b;
      --amber-dim:  #92600a;
      --green:      #22d3a0;
      --red:        #f87171;
      --blue:       #60a5fa;
      --white:      #ffffff;
      --radius:     8px;
      --font-head:  'DM Serif Display', Georgia, serif;
      --font-body:  'IBM Plex Sans', system-ui, sans-serif;
      --font-mono:  'IBM Plex Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── NAV ─── */
    .navbar {
      background: var(--navy-mid);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-brand {
      font-family: var(--font-head);
      font-size: 1.4rem;
      color: var(--amber);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .navbar-brand span { color: var(--text); }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .nav-user {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .nav-role {
      background: var(--amber-dim);
      color: var(--amber);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-body);
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ─── LAYOUT ─── */
    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    .page-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .page-title {
      font-family: var(--font-head);
      font-size: 2rem;
      color: var(--white);
      letter-spacing: -0.03em;
    }
    .page-subtitle { color: var(--muted); margin-top: 4px; font-size: 0.9rem; }

    /* ─── CARDS ─── */
    .card {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #3a5070; }
    .card-title {
      font-family: var(--font-head);
      font-size: 1.15rem;
      color: var(--white);
      margin-bottom: 0.25rem;
    }
    .card-sub {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--amber);
      color: #0c1000;
    }
    .btn-primary:hover { background: #fbbf24; }
    .btn-primary:disabled {
      background: var(--amber-dim);
      color: #7a5500;
      cursor: not-allowed;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--amber); color: var(--amber); }
    .btn-danger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--red);
    }
    .btn-danger:hover { background: rgba(248,113,113,0.1); }
    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }

    /* ─── STATUS BADGES ─── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-active  { background: rgba(34,211,160,0.12); color: var(--green); }
    .badge-closed  { background: rgba(122,147,184,0.12); color: var(--muted); }
    .badge-present { background: rgba(34,211,160,0.12); color: var(--green); }

    /* ─── ALERTS ─── */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }
    .alert-error   { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .alert-success { background: rgba(34,211,160,0.1);  border: 1px solid rgba(34,211,160,0.3);  color: var(--green); }
    .alert-info    { background: rgba(96,165,250,0.1);  border: 1px solid rgba(96,165,250,0.3);  color: var(--blue); }

    /* ─── FORM ELEMENTS ─── */
    .form-group { margin-bottom: 1.2rem; }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      width: 100%;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-control:focus { border-color: var(--amber); }
    select.form-control option { background: var(--navy-mid); }

    /* ─── GRID ─── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }

    /* ─── DIVIDER ─── */
    .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

    /* ─── SPINNER ─── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(245,158,11,0.3);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── COUNTDOWN ─── */
    .countdown {
      font-family: var(--font-mono);
      font-size: 2rem;
      color: var(--amber);
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .countdown.urgent { color: var(--red); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }

    /* ─── STAT BOX ─── */
    .stat-box { text-align: center; padding: 1rem; }
    .stat-value {
      font-family: var(--font-head);
      font-size: 2.2rem;
      color: var(--white);
    }
    .stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    /* ─── TABLE ─── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px;
      border-bottom: 1px solid rgba(36,55,87,0.5);
      font-size: 0.88rem;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ─── FADE IN ANIMATION ─── */
    .fade-in {
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 640px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .page-title { font-size: 1.5rem; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if user is defined and user %}
  <nav class="navbar">
    <a href="/" class="navbar-brand">Attend<span>X</span></a>
    <div class="navbar-right">
      <span class="nav-user">{{ user.email }}</span>
      <span class="nav-role">{{ user.role }}</span>
      <a href="/logout" class="btn-logout">Sign out</a>
    </div>
  </nav>
  {% endif %}

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
